; esp32-solder — T12 soldering station on ESP32-S3
; env:native  = host simulation (shared control code + thermal plant)  <- default, no hardware
; env:esp32*  = firmware (build-only until hardware is connected)
;
; Toolchain: pio from PATH
;   e.g.  pio run     (from this dir)
;
; NB: src_dir is a GLOBAL option — one src/ for all envs; per-env entry points are
;     selected with build_src_filter.

[platformio]
default_envs = native

[env:native]
platform = native
lib_ldf_mode = deep+
build_src_filter = +<sim_main.cpp>
build_flags = -std=gnu++17 -O2 -Wall -Wextra

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
lib_ldf_mode = chain+
build_src_filter = +<main.cpp>
; lib_deps added when firmware bring-up starts (U8g2, ADS1x15, ...).
; WiFi/web (ESPAsyncWebServer) is deferred -> serial telemetry first.
