; esp32-solder: T12 soldering station on ESP32-C3
; env:native        = host simulation of the shared control code + thermal plant
;                     (default env, no hardware needed)
; firmware/t12.yaml = the ESP32-C3 firmware, built by ESPHome; the control code
;                     comes from lib/control through components/t12/
;
; Toolchain: pio from PATH
;   pio run                    build the native simulation
;   .pio/build/native/program  run it  (--self-test for the unit checks)

[platformio]
default_envs = native

[env:native]
platform = native
build_src_filter = +<sim_main.cpp>
build_flags = -std=gnu++17 -O2 -Wall -Wextra
