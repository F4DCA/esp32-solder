; ESP32-C3 port of the ATmega T12 soldering station.
;
; The control logic, menus and display drawing come from the upstream v1.9
; sketch in software/original/sources/. This branch is a hardware port, not a
; rewrite: the AVR ADC, the Timer1 PWM, the EEPROM and the U8glib calls are the
; only pieces replaced. See software/esp32/README.md for the mapping.
;
;   pio run          build the firmware
;   pio run -t upload    flash (hardware must be wired; not done here)

[platformio]
default_envs = esp32-c3
src_dir = software/esp32/src
include_dir = software/esp32/include
lib_dir = software/esp32/lib

[env:esp32-c3]
; pioarduino 55.03.312 ships Arduino core 3.3.12 / ESP-IDF 5.5, which is the
; same IDF generation the ESPHome branch builds against.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.28.8
build_flags = -DCORE_DEBUG_LEVEL=0
